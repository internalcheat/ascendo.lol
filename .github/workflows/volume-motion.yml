name: Volume control motion
on:
  push:
    branches: [codex/volume-motion-polish, main]
    paths: [app.js, styles.css, scripts/test-volume-motion.mjs, .github/workflows/volume-motion.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/test-volume-motion.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: volume-motion-checks
          path: test-results/volume/
          retention-days: 7
          if-no-files-found: ignore
