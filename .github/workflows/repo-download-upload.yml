name: Finalize R.E.P.O download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repo-download-upload.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-download-upload
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/450574613" > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          release=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          assert release['tag_name']=='repo-v0.5.0'
          asset=next(item for item in release['assets'] if item['name']=='REPO.v0.5.0-OFME.rar')
          assert asset['state']=='uploaded'
          assert asset['size']==1091735758
          assert asset['digest']=='sha256:bd39a6e9bcaf98cfac9c6c8603fe1351003e43b391e93f681eeae9095f94b920'
          print('The uploaded archive exactly matches the supplied file.')
          PY
      - name: Publish the verified download
        shell: bash
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/450574613" -F draft=false -f make_latest=false -f tag_name=repo-v0.5.0 -f target_commitish=main --jq '.html_url'
