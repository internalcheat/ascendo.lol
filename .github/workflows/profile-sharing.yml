name: Profile sharing

on:
  push:
    branches: [profile-sharing, profile-expression, saved-profile-presets, fix-layout-social-borders, profile-appearance-presets, codex/preset-management, main]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: profile-sharing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/test-profile-capture.mjs
      - run: node scripts/test-profile-expression.mjs
      - run: node scripts/test-layout-social-borders.mjs
      - run: node scripts/test-studio-presets.mjs
      - run: node scripts/test-profile-appearance.mjs
      - run: node scripts/share-runner.mjs health
        if: github.ref != 'refs/heads/saved-profile-presets' && github.ref != 'refs/heads/fix-layout-social-borders' && github.ref != 'refs/heads/profile-appearance-presets' && github.ref != 'refs/heads/codex/preset-management'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-capture-checks
          path: test-results/capture/
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: preflight
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || needs.preflight.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/share-runner.mjs run
        env:
          GITHUB_TOKEN: ${{ github.token }}
