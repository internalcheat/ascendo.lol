name: Private chess
on:
  push:
    branches: [codex/private-chess, codex/chess-bots, main]
  workflow_dispatch:
    inputs:
      live_bot:
        description: Verify the published bot in isolated browser contexts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/test-chess-browser.mjs
      - run: node scripts/test-chess-bots-browser.mjs
      - run: CHESS_BOT_LIVE=1 node scripts/test-chess-bots-browser.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.live_bot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-browser-checks
          path: |
            test-results/chess/
            test-results/chess-bots/
          retention-days: 7
          if-no-files-found: ignore
