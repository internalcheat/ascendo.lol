name: Ascendo Forge
on:
  push:
    branches: [main]
    paths: ['forge/**', 'package.json', 'package-lock.json', '.github/workflows/forge.yml']
  pull_request:
    paths: ['forge/**', 'package.json', 'package-lock.json', '.github/workflows/forge.yml']
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:forge
