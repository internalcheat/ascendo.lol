<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; connect-src https://fstdttaxflayhtwhnbih.supabase.co; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Ascendo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 28%, #eae4ff 0%, #f2f2f5 65%);
      color: #18181c;
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(40px, 8vw, 72px) clamp(24px, 7vw, 64px);
      border: 1px solid #e9e4fb;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 22px 70px #28204a18, 0 2px 8px #28204a0c;
      text-align: center;
    }
    .wordmark {
      display: block;
      width: 144px;
      height: auto;
      margin: 0 auto 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 3rem);
      font-weight: 780;
      letter-spacing: -.055em;
      line-height: 1.12;
      text-wrap: balance;
    }
    #waitStatus { margin: 0; color: #575760; }
    a { color: #5042d1; }
    button {
      margin: 24px auto 0;
      border: 1px solid #dad3fb;
      border-radius: 8px;
      padding: 8px 18px;
      background: #f7f5ff;
      color: #5042d1;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
    }
    button:focus-visible, a:focus-visible { outline: 2px solid #5d50eb; outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <img class="wordmark" src="/assets/ascendo-login-wordmark.png" width="144" height="48" alt="Ascendo">
    <p id="waitStatus" role="status">Checking your session…</p>
    <button type="button" id="retrySessionButton" hidden>Try again</button>
    <section id="waitContent" hidden aria-labelledby="waitHeading">
      <h1 id="waitHeading">nice u logged in, now u wait :)</h1>
      <button type="button" id="signOutButton">Sign out</button>
    </section>
    <noscript><p>Enable JavaScript to continue, then <a href="/">sign in</a>.</p></noscript>
  </main>
  <script type="module" src="/assets/waiting-page.mjs"></script>
</body>
</html>
