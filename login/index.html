<title>Private login | Ascendo</title>

<body class="page page--editor">
<div class="studio-shell"><header class="studio-header"><a class="studio-brand" href="/" aria-label="Ascendo home"><img src="/assets/ascendo-logo.png" alt="Ascendo" width="1300" height="414"></a><a class="studio-button" href="/">Back to home</a></header></div>
<main class="login-card studio-panel">
<span class="studio-kicker">Your space. Your identity.</span>
<h1>Make it yours.</h1>
<p class="studio-subtitle">A private studio for invited profiles. Enter your access code to continue.</p>
<form id="loginForm">
<label class="studio-label" for="accessCode">Private access code</label>
<input class="studio-input" id="accessCode" name="code" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6,32}" minlength="6" maxlength="32" required disabled aria-describedby="loginStatus">
<div id="securityCheck"></div>
<button class="studio-button studio-button--primary" type="submit" disabled>Open my studio <span aria-hidden="true">↗</span></button>
<p class="studio-status" id="loginStatus" role="status" aria-live="polite">Checking the private profile service…</p>
</form>
<noscript><p class="studio-help">JavaScript is needed for secure login. The public website remains available.</p></noscript>
</main>
</body>
