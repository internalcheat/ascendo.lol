<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="description" content="Minecraft gradient text, server MOTD, item name and chat message tools. Preview your formatting and copy the output with Ascendo Forge.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Forge · Ascendo">
  <meta property="og:description" content="Minecraft text formatting tools.">
  <link rel="canonical" href="https://ascendo.lol/forge/">
  <title>Forge · Ascendo</title>
  <link rel="icon" href="/assets/ascendo-icon-32.png?v=20261023-2" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/ascendo-icon-180.png?v=20261023-2">
  <link rel="stylesheet" href="/fonts.css?v=20261025-6">
  <link rel="stylesheet" href="./forge.css?v=20261116-2">
  <script type="module" src="./app.mjs?v=20261116-2"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to editor</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Ascendo home"><img src="/assets/ascendo-logo.png" width="1300" height="414" alt="Ascendo"></a>
      <h1>Forge</h1>
      <nav aria-label="Main navigation"><a href="/plugins/">Plugins</a></nav>
    </div>
  </header>

  <main class="main-shell">
    <nav class="tool-list" aria-label="Creation tools">
      <button type="button" data-tool="gradient" aria-pressed="true">Gradient text</button>
      <button type="button" data-tool="motd" aria-pressed="false">Server MOTD</button>
      <button type="button" data-tool="item" aria-pressed="false">Item names</button>
      <button type="button" data-tool="chat" aria-pressed="false">Chat messages</button>
    </nav>

    <div class="workspace" id="workspace" tabindex="-1">
      <section class="editor-panel" aria-labelledby="tool-title">
        <div class="section-heading">
          <h2 id="tool-title">Gradient text</h2>
          <button type="button" class="text-button" id="reset-tool">Reset</button>
        </div>

        <div class="text-field">
          <div class="field-heading">
            <label for="text-input">Text</label>
            <span id="character-count">7 / 240</span>
          </div>
          <textarea id="text-input" maxlength="240" rows="3" spellcheck="false" placeholder="Enter text" aria-describedby="character-count">Ascendo</textarea>
        </div>

        <fieldset class="color-section">
          <legend class="visually-hidden">Colors</legend>
          <div class="field-heading">
            <span class="field-label">Colors</span>
            <button type="button" class="text-button" id="swap-colors">Swap</button>
          </div>
          <div class="colors-row">
            <div class="color-field">
              <label for="color-start">Start</label>
              <div class="color-input-wrap">
                <input type="color" id="color-start" value="#a855f7" aria-label="Start color picker">
                <input type="text" id="color-start-value" value="#A855F7" maxlength="7" pattern="#[0-9a-fA-F]{6}" spellcheck="false" aria-label="Start color hex code" autocomplete="off">
              </div>
            </div>
            <div class="color-field">
              <label for="color-end">End</label>
              <div class="color-input-wrap">
                <input type="color" id="color-end" value="#ec4899" aria-label="End color picker">
                <input type="text" id="color-end-value" value="#EC4899" maxlength="7" pattern="#[0-9a-fA-F]{6}" spellcheck="false" aria-label="End color hex code" autocomplete="off">
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="preset-section">
          <legend>Presets</legend>
          <div class="presets">
            <button type="button" data-preset="purple" aria-pressed="true" aria-label="Purple color preset"><span class="preset-swatch" aria-hidden="true"></span>Purple</button>
            <button type="button" data-preset="aurora" aria-pressed="false" aria-label="Aurora color preset"><span class="preset-swatch" aria-hidden="true"></span>Aurora</button>
            <button type="button" data-preset="sunset" aria-pressed="false" aria-label="Sunset color preset"><span class="preset-swatch" aria-hidden="true"></span>Sunset</button>
            <button type="button" data-preset="ice" aria-pressed="false" aria-label="Ice color preset"><span class="preset-swatch" aria-hidden="true"></span>Ice</button>
            <button type="button" data-preset="ember" aria-pressed="false" aria-label="Ember color preset"><span class="preset-swatch" aria-hidden="true"></span>Ember</button>
          </div>
        </fieldset>

        <div class="formatting-row">
          <fieldset class="style-field">
            <legend>Style</legend>
            <div class="style-buttons">
              <button type="button" data-style="bold" aria-pressed="false" aria-label="Bold"><b>B</b></button>
              <button type="button" data-style="italic" aria-pressed="false" aria-label="Italic"><i>I</i></button>
              <button type="button" data-style="underlined" aria-pressed="false" aria-label="Underline"><u>U</u></button>
              <button type="button" data-style="strikethrough" aria-pressed="false" aria-label="Strikethrough"><s>S</s></button>
            </div>
          </fieldset>
          <div class="mode-field">
            <label for="mode">Color mode</label>
            <select id="mode"><option value="gradient">Gradient</option><option value="solid">Solid color</option></select>
          </div>
        </div>
      </section>

      <section class="result-panel" aria-label="Preview and output">
        <h2>Preview</h2>
        <div class="preview-scene">
          <div class="preview-text" id="preview-text">Ascendo</div>
          <p class="empty-preview" id="empty-preview" hidden>Enter text to preview.</p>
        </div>

        <div class="output-section">
          <div class="output-heading">
            <label for="output">Output</label>
            <label for="format" class="visually-hidden">Output format</label>
            <select id="format" aria-label="Output format">
              <option value="minimessage">MiniMessage</option>
              <option value="legacy">Legacy RGB (&amp;x)</option>
              <option value="json">Text component JSON</option>
              <option value="motd">Vanilla server.properties</option>
            </select>
          </div>
          <p id="compatibility" class="compatibility">For plugins that support MiniMessage.</p>
          <textarea id="output" rows="5" readonly spellcheck="false" aria-label="Generated formatted text"></textarea>
          <div class="output-actions">
            <button type="button" class="primary-button" id="copy-output"><span id="copy-label">Copy</span></button>
            <button type="button" id="download-output">Download</button>
            <button type="button" id="share-link">Share link</button>
          </div>
          <p id="status" class="status-message" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>
    <noscript><p class="noscript-message">Enable JavaScript to use Forge.</p></noscript>
  </main>
</body>
</html>
