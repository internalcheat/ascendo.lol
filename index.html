<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'; connect-src https://fstdttaxflayhtwhnbih.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Sign in | Ascendo</title>
<style>
:root{
  --ink:#18181c;
  --muted:#9797a1;
  --line:#dedee6;
  --paper:#fff;
  --violet-1:#5a49e9;
  --violet-2:#6855f1;
  --violet-3:#4869ed;
  --slide:cubic-bezier(.76,0,.24,1);
  --soft:cubic-bezier(.22,.88,.28,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f5;color:var(--ink)}
body{min-height:100vh;display:grid;place-items:center;padding:24px}

.card{
  position:relative;
  width:min(920px,96vw);
  height:560px;
  overflow:hidden;
  border-radius:12px;
  background:#fff;
  box-shadow:0 22px 70px rgba(31,27,65,.13),0 2px 8px rgba(31,27,65,.05);
}

/* Two fixed white form stages. Only the exposed one is interactive. */
.pane{
  position:absolute;
  top:0;
  width:50%;
  height:100%;
  display:grid;
  place-items:center;
  padding:52px 58px;
  background:#fff;
}
.login-pane{left:0}
.register-pane{right:0}

.form{
  width:min(335px,100%);
  transition:opacity 220ms ease,transform 420ms var(--soft),filter 220ms ease;
}
.login-pane .form{opacity:1;transform:translateX(0)}
.register-pane .form{opacity:0;transform:translateX(28px);pointer-events:none}

.card.register .login-pane .form{
  opacity:0;
  transform:translateX(-28px);
  pointer-events:none;
}
.card.register .register-pane .form{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
  transition-delay:250ms;
}
.card.register .register-pane .field,
.card.register .register-pane .row,
.card.register .register-pane .primary,
.card.register .register-pane .small-switch{
  animation:registerRise 430ms var(--soft) both;
}
.card.register .register-pane .field:nth-of-type(1){animation-delay:260ms}
.card.register .register-pane .field:nth-of-type(2){animation-delay:300ms}
.card.register .register-pane .field:nth-of-type(3){animation-delay:340ms}
.card.register .register-pane .row{animation-delay:380ms}
.card.register .register-pane .primary{animation-delay:410ms}
.card.register .register-pane .small-switch{animation-delay:440ms}
@keyframes registerRise{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.brand{display:block;width:108px;height:auto;margin:0 0 17px}
h1{font-size:26px;line-height:1.12;letter-spacing:-.045em;margin:0 0 19px;font-weight:770}
.field{margin-bottom:12px}
label{display:block;font-size:10px;font-weight:650;color:#65656f;margin:0 0 6px 1px}
input{
  width:100%;
  height:38px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#fff;
  padding:0 11px;
  outline:none;
  color:#222;
  font:inherit;
  font-size:11px;
  transition:border-color 150ms ease,box-shadow 170ms ease;
}
input:focus{border-color:#786df0;box-shadow:0 0 0 3px rgba(93,78,235,.10)}
input.invalid{border-color:#e66f7e;box-shadow:0 0 0 3px rgba(230,111,126,.08)}
input.valid{border-color:#32b99c;box-shadow:0 0 0 3px rgba(50,185,156,.08)}
.input-wrap{position:relative}
.input-wrap input{padding-right:38px}
.eye{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:#9696a0;
  display:grid;place-items:center;cursor:pointer;transition:background 120ms ease,color 120ms ease,transform 120ms var(--soft)
}
.eye:hover{background:#f4f3fb;color:#5d50eb}.eye:active{transform:translateY(-50%) scale(.92)}
.eye svg{width:14px;height:14px}
.strength{height:4px;margin-top:7px;border-radius:999px;background:#efeff3;overflow:hidden}
.strength-bar{height:100%;width:0;border-radius:inherit;background:#d7d7dd;transition:width 220ms var(--soft),background 180ms ease}
.strength-copy{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:8px;color:#aaa9b1}
.req{display:flex;gap:6px;align-items:center}.req i{width:5px;height:5px;border-radius:50%;background:#c7c6cd;transition:background 150ms ease,box-shadow 150ms ease}.req.ok i{background:#32b99c;box-shadow:0 0 8px rgba(50,185,156,.25)}.req.ok{color:#6b9d91}
.form-status{margin:0;color:#575760;font-size:12px;line-height:1.35}
.form-status:not(:empty){margin-top:12px}
.form-status[data-error]{color:#aa304d}
.primary:disabled{cursor:wait;opacity:.65}
.row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 15px;font-size:9px;color:#9999a2}
.check{display:flex;align-items:center;gap:5px}.check input{width:11px;height:11px;margin:0;accent-color:#5d50eb}
.link{color:#5d50eb;text-decoration:none;font-weight:650}
.primary{
  position:relative;
  overflow:hidden;
  width:100%;
  height:38px;
  border:0;
  border-radius:5px;
  background:linear-gradient(135deg,var(--violet-1),var(--violet-2));
  color:#fff;
  font:inherit;
  font-size:10px;
  font-weight:730;
  cursor:pointer;
  box-shadow:0 5px 14px rgba(84,70,234,.18);
  transition:transform 145ms var(--soft),box-shadow 145ms var(--soft);
}
.primary:hover{transform:scale(1.02);box-shadow:0 8px 18px rgba(84,70,234,.24)}
.primary:active{transform:scale(.95)}
.or{display:flex;align-items:center;gap:9px;color:#b0afb7;font-size:8px;margin:14px 0}
.or:before,.or:after{content:"";height:1px;flex:1;background:#ececf1}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.social{display:flex;align-items:center;justify-content:center;gap:7px;height:34px;border:1px solid #e3e3e8;border-radius:5px;background:#fff;color:#575760;font-size:9px;font-weight:650;cursor:pointer}
.social[aria-disabled=true]{cursor:default}
.social img{display:block;width:15px;height:15px;object-fit:contain}
.small-switch{text-align:center;font-size:9px;color:#a09fa9;margin-top:15px}
.small-switch button{border:0;background:none;padding:0;color:#5d50eb;font:inherit;font-weight:760;cursor:pointer}

/* This is the key animation from the reference: the entire purple card crosses
   from the RIGHT half to the LEFT half, exposing the register form on the right. */
.slider{
  position:absolute;
  z-index:10;
  top:0;
  left:50%;
  width:50%;
  height:100%;
  overflow:hidden;
  color:white;
  background:
    radial-gradient(circle at 18% 14%,rgba(255,255,255,.13),transparent 25%),
    radial-gradient(circle at 83% 78%,rgba(67,132,255,.24),transparent 31%),
    linear-gradient(135deg,var(--violet-1) 0%,var(--violet-2) 52%,var(--violet-3) 100%);
  transform:translateX(0);
  transition:transform 690ms var(--slide);
  will-change:transform;
}
.card.register .slider{transform:translateX(-100%)}
.slider:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.14;
  background-image:radial-gradient(rgba(255,255,255,.22) .7px,transparent .7px);
  background-size:13px 13px;
}

.slider-inner{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  padding:28px;
}
.illustration{height:88px;display:grid;place-items:center;margin-bottom:2px}
.people{position:relative;width:110px;height:66px}
.avatar{position:absolute;width:29px;height:29px;border-radius:7px;background:rgba(255,255,255,.93);box-shadow:0 8px 20px rgba(25,20,91,.14)}
.avatar:before{content:"";position:absolute;left:10px;top:5px;width:9px;height:9px;border-radius:50%;background:#776af1}
.avatar:after{content:"";position:absolute;left:7px;right:7px;bottom:5px;height:7px;border-radius:8px 8px 4px 4px;background:#bbb6fc}
.a1{left:40px;top:25px;transform:scale(1.18)}
.a2{left:8px;top:8px;transform:scale(.72)}
.a3{right:8px;top:8px;transform:scale(.72)}
.bubble{position:absolute;width:13px;height:10px;border-radius:3px;background:rgba(255,255,255,.78)}
.b1{left:23px;top:0}.b2{right:23px;top:0}

.copy-stage{position:relative;width:280px;height:125px}
.copy{
  position:absolute;
  inset:0;
  transition:opacity 180ms ease,transform 350ms var(--soft);
  pointer-events:none;
}
.copy h2{font-size:24px;letter-spacing:-.04em;margin:0 0 9px;font-weight:780}
.copy p{font-size:10px;line-height:1.55;color:rgba(255,255,255,.74);margin:0 auto 19px;max-width:220px}
.copy-register{opacity:1;transform:translateY(0);pointer-events:auto}
.copy-login{opacity:0;transform:translateY(12px);pointer-events:none}
.card.register .copy-register{opacity:0;transform:translateY(-12px);pointer-events:none}
.card.register .copy-login{opacity:1;transform:translateY(0);transition-delay:300ms;pointer-events:auto}
.card:not(.register) .copy-register{transition-delay:300ms}
.ghost{
  height:34px;
  min-width:112px;
  padding:0 17px;
  border:1px solid rgba(255,255,255,.52);
  border-radius:5px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font:inherit;
  font-size:9px;
  font-weight:730;
  cursor:pointer;
  transition:background 140ms ease,transform 140ms var(--soft);
}
.ghost:hover{background:rgba(255,255,255,.13);transform:scale(1.03)}
.ghost:active{transform:scale(.96)}

.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.34);
  transform:scale(0);
  pointer-events:none;
  animation:ripple 480ms var(--soft) forwards;
}
@keyframes ripple{to{transform:scale(4);opacity:0}}

@media(max-width:720px){
  .card{width:min(430px,100%);height:auto}
  .pane{position:relative;width:100%;height:auto;min-height:460px;left:auto;right:auto;padding:38px 34px 30px}
  .card:not(.register) .register-pane,.card.register .login-pane{display:none}
  .slider,.card.register .slider{
    position:relative;
    left:auto;
    top:auto;
    width:100%;
    height:220px;
    transform:none;
    transition:none;
  }
  .illustration{display:none}
  .copy-stage{height:120px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<main class="card" id="card">
  <section class="pane login-pane">
    <form class="form" id="loginForm" method="post" novalidate>
      <img class="brand" src="/assets/ascendo-login-wordmark.png" alt="Ascendo" width="108" height="36">
      <h1>Welcome back</h1>

      <div class="field">
        <label for="loginIdentifier">Email or username</label>
        <input id="loginIdentifier" name="identifier" type="text" placeholder="Email or username" required maxlength="254" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="row">
        <label class="check"><input id="loginRemember" type="checkbox"> Remember me</label>
      </div>

      <button class="primary" type="submit">Sign in</button>
      <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
      <div class="or">or continue with</div>
      <div class="socials">
        <button class="social" type="button" aria-disabled="true"><img src="/assets/google-sign-in-logo.png" alt="" width="15" height="15">Google</button>
        <button class="social" type="button" aria-disabled="true"><img src="/assets/apple-sign-in-logo.svg" alt="" width="15" height="15">Apple</button>
      </div>
      <div class="small-switch">New here? <button type="button" data-go="register">Create account</button></div>
    </form>
  </section>

  <section class="pane register-pane">
    <form class="form" id="registerForm" method="post" novalidate>
      <img class="brand" src="/assets/ascendo-login-wordmark.png" alt="Ascendo" width="108" height="36">
      <h1>Create your account</h1>

      <div class="field">
        <label for="registerUsername">Username</label>
        <input id="registerUsername" name="username" type="text" placeholder="yourusername" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" title="Use 3 to 24 letters, numbers, or underscores" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>

      <div class="field">
        <label for="registerEmail">Email address</label>
        <input id="registerEmail" name="email" maxlength="254" type="email" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="registerPassword">Password</label>
        <div class="input-wrap">
          <input id="registerPassword" name="password" type="password" placeholder="Create a password" required minlength="8" autocomplete="new-password">
          <button class="eye" type="button" id="togglePassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.5 12s3-5 8.5-5 8.5 5 8.5 5-3 5-8.5 5-8.5-5-8.5-5Z" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.7"/>
            </svg>
          </button>
        </div>
        <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-copy">
          <span id="strengthLabel">Use 8+ characters</span>
          <span class="req" id="strengthReq"><i></i><span>secure</span></span>
        </div>
      </div>

      <button class="primary" type="submit">Create account</button>
      <p class="form-status" id="registerStatus" role="status" aria-live="polite"></p>
      <div class="small-switch">Already have an account? <button type="button" data-go="login">Sign in</button></div>
    </form>
  </section>

  <aside class="slider">
    <div class="slider-inner">
      <div>
        <div class="illustration">
          <div class="people">
            <i class="bubble b1"></i><i class="bubble b2"></i>
            <i class="avatar a1"></i><i class="avatar a2"></i><i class="avatar a3"></i>
          </div>
        </div>

        <div class="copy-stage">
          <div class="copy copy-register">
            <h2>New here?</h2>
            <p>Create an account and start your journey with us.</p>
            <button class="ghost" type="button" data-go="register">Create account</button>
          </div>

          <div class="copy copy-login">
            <h2>Already have an account?</h2>
            <p>Welcome back. Sign in and continue where you left off.</p>
            <button class="ghost" type="button" data-go="login">Sign in</button>
          </div>
        </div>
      </div>
    </div>
  </aside>
</main>

<script type="module" src="/assets/login-form.mjs"></script>
</body>
</html>
